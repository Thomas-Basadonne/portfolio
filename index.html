        <section id="about-static"><h1>Thomas Basadonne</h1><p>Frontend Developer · Commerce &amp; AI tools · Italy · Remote</p><h2>Built to hold. Wired to wonder.</h2><p>I'm a frontend developer at CØDESTORM. Since January 2025 I've been on the team building Mapei's B2B e-commerce: a headless PWA Studio storefront on Magento 2. Outside client work I build local-first AI tools and developer tooling.</p></section>
        <section id="work-static"><h2>Selected work</h2><ul><li><strong>Mapei B2B Commerce</strong> — headless PWA Studio storefront on Magento 2, client work via CØDESTORM.</li><li><strong>Project Twin</strong> — a local digital twin of a Magento codebase: static analysis to a Neo4j graph, no LLM.</li><li><strong>Privacy Guard</strong> — desktop app that redacts personal data on-device before it reaches a cloud AI; co-developed with Alberto Sigismondi.</li><li><strong>La Fetuseria</strong> — mobile-first operations agenda for a small hospitality business.</li><li><strong>Promptify</strong> — Raycast extension that structures prompts with a local Ollama model (<a href="https://github.com/Thomas-Basadonne/promptify-raycast">source</a>).</li><li><strong>SGAGGIO</strong> — a side hustle just getting started: a small digital studio for restaurants and hospitality businesses in the Marche. No clients yet.</li></ul><h2>Open source</h2><p>15 merged pull requests to <a href="https://github.com/albidev/hermes-mission-control/pulls?q=is%3Apr+author%3AThomas-Basadonne+is%3Amerged">Hermes Mission Control</a> and a fix to <a href="https://github.com/steipete/CodexBar/pull/4308">CodexBar</a>.</p></section>
        <section id="experience-static"><h2>Experience</h2><ul><li>2025 — present · Frontend Developer, Mapei — CØDESTORM</li><li>2024 · Backend Developer, Moto Morini — CØDESTORM</li><li>2024 · Frontend Developer, DonnaD — CØDESTORM</li><li>2024 · Frontend Developer, DR Automobiles — CØDESTORM</li></ul></section>
